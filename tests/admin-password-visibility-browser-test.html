<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Admin password visibility browser test</title>
<pre id="result">pending</pre>
<script>
  (async () => {
    const result = document.getElementById('result');
    try {
      const response = await fetch('../ADMIN/login.php');
      if (!response.ok) throw new Error('Admin login page did not load.');
      const documentFromServer = new DOMParser().parseFromString(await response.text(), 'text/html');
      const form = documentFromServer.querySelector('.login-form');
      const source = documentFromServer.querySelector('script[src]')?.getAttribute('src');
      if (!form || !source) throw new Error('Admin login form or script is missing.');
      document.body.appendChild(form);

      const script = document.createElement('script');
      script.src = '../ADMIN/' + source;
      await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error('Admin login script did not load.'));
        document.body.appendChild(script);
      });

      const password = document.getElementById('admin-password');
      const toggle = document.querySelector('[data-password-toggle]');
      password.value = 'test-visible-password';
      toggle.click();
      if (password.type !== 'text' || password.value !== 'test-visible-password' || toggle.getAttribute('aria-pressed') !== 'true') {
        throw new Error('First click did not reveal the password.');
      }
      toggle.click();
      if (password.type !== 'password' || password.value !== 'test-visible-password' || toggle.getAttribute('aria-pressed') !== 'false') {
        throw new Error('Second click did not hide the password.');
      }
      result.textContent = 'PASS: password revealed and hidden without changing its value';
    } catch (error) {
      result.textContent = 'FAIL: ' + error.message;
    }
  })();
</script>
</html>
