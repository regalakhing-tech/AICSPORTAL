<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Applicant password reset visibility</title>
  <script>
    function run(frame) {
      const result = document.getElementById('result');
      try {
        const page = frame.contentDocument;
        page.getElementById('forgot-password-trigger').click();
        const modal = page.getElementById('password-reset-modal');
        if (modal.classList.contains('hidden')) throw new Error('Password reset modal did not open.');

        const password = page.getElementById('password-reset-password');
        const confirmation = page.getElementById('password-reset-confirm');
        const showPassword = page.querySelector('[data-password-toggle][data-target="password-reset-password"]');
        const showConfirmation = page.querySelector('[data-password-toggle][data-target="password-reset-confirm"]');
        if (!showPassword || !showConfirmation) throw new Error('Both visibility buttons are required.');

        password.value = 'SamplePass123';
        confirmation.value = 'SamplePass123';
        if (password.type !== 'password' || confirmation.type !== 'password') {
          throw new Error('Reset passwords must start hidden.');
        }

        showPassword.click();
        if (password.type !== 'text' || confirmation.type !== 'password' || password.value !== 'SamplePass123' || showPassword.getAttribute('aria-pressed') !== 'true') {
          throw new Error('New password visibility did not toggle independently.');
        }

        showConfirmation.click();
        if (confirmation.type !== 'text' || showConfirmation.getAttribute('aria-pressed') !== 'true') {
          throw new Error('Confirmation visibility did not toggle.');
        }

        showPassword.click();
        showConfirmation.click();
        if (password.type !== 'password' || confirmation.type !== 'password' || password.value !== 'SamplePass123' || confirmation.value !== 'SamplePass123') {
          throw new Error('Toggling off failed to hide the passwords or changed their values.');
        }

        document.body.dataset.result = 'pass';
        result.textContent = 'PASS password reset visibility toggles';
      } catch (error) {
        document.body.dataset.result = 'fail';
        result.textContent = 'FAIL ' + error.message;
      }
    }
  </script>
</head>
<body data-result="waiting">
  <iframe src="../Applicants/login.php" title="Applicant login" onload="run(this)"></iframe>
  <pre id="result">WAITING</pre>
</body>
</html>
