<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Applicant required document preview test</title>
<link rel="stylesheet" href="../Applicants/css files/applicant-pages.css">
<body>
<input type="radio" name="assistance_type" value="medical" checked>
<div id="dynamic-upload-container" class="step-panel-docs-full">
  <div id="applicant-upload-fields"></div>
  <div id="beneficiary-upload-fields"></div>
</div>
<output id="result">Pending</output>
<script>
window.AICS_DOCUMENT_REQUIREMENTS = { medical: [
  { id: 'valid_id', label: 'Valid ID', required: true },
  { id: 'med_cert', label: 'Medical Certificate', required: true },
  { id: 'billing_statement', label: 'Billing Statement', required: true }
] };
window.AICS_DRAFT_DOCUMENTS = {
  med_cert: { document_id: '11111111-1111-1111-1111-111111111111', file_name: 'medical.png', mime_type: 'image/png' },
  billing_statement: { document_id: '22222222-2222-2222-2222-222222222222', file_name: 'bill.pdf', mime_type: 'application/pdf' }
};
</script>
<script src="../Applicants/js files/applicant-pages.js"></script>
<script>
const failures = [];
const check = (condition, message) => { if (!condition) failures.push(message); };
updateDynamicUploadFields();
check(document.querySelector('#preview-tile-med_cert img.document-preview-image')?.getAttribute('src')?.includes('draft-document-view.php?document_id=11111111-1111-1111-1111-111111111111'), 'saved image preview');
check(document.querySelector('#preview-tile-billing_statement iframe.document-preview-pdf')?.getAttribute('src')?.includes('draft-document-view.php?document_id=22222222-2222-2222-2222-222222222222'), 'saved PDF preview');
let savedPickerOpens = 0;
document.getElementById('file-med_cert').addEventListener('click', event => { savedPickerOpens++; event.preventDefault(); });
document.getElementById('preview-tile-med_cert')?.click();
check(savedPickerOpens === 1, 'saved photo tile opens file picker');
check(!document.getElementById('file-preview-modal'), 'photo tile does not open preview');
document.querySelector('#success-card-med_cert .document-view-button')?.click();
check(document.querySelector('#file-preview-modal .preview-modal-body img')?.getAttribute('src')?.includes('draft-document-view.php?document_id=11111111-1111-1111-1111-111111111111'), 'saved View button opens image preview');
window.AICS_DRAFT_DOCUMENTS = {};
updateDynamicUploadFields();
function selectFile(type, file) {
  const input = document.getElementById(`file-${type}`);
  const transfer = new DataTransfer();
  transfer.items.add(file);
  input.files = transfer.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
const pngBytes = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL/nwAAAABJRU5ErkJggg=='), c => c.charCodeAt(0));
selectFile('med_cert', new File([pngBytes], 'new-medical.png', { type: 'image/png' }));
selectFile('billing_statement', new File(['%PDF-1.4\n'], 'new-bill.pdf', { type: 'application/pdf' }));
check(document.querySelector('#preview-tile-med_cert img.document-preview-image')?.getAttribute('src')?.startsWith('blob:'), 'new image preview');
check(document.querySelector('#preview-tile-billing_statement iframe.document-preview-pdf')?.getAttribute('src')?.startsWith('blob:'), 'new PDF preview');
check(getComputedStyle(document.querySelector('#preview-tile-med_cert img.document-preview-image')).display !== 'none', 'image shown inline');
check(getComputedStyle(document.querySelector('#preview-tile-billing_statement iframe.document-preview-pdf')).display !== 'none', 'PDF shown inline');
check(!document.querySelector('#success-card-med_cert .upload-again-btn'), 'no separate reselect button');
let newPickerOpens = 0;
document.getElementById('file-med_cert').addEventListener('click', event => { newPickerOpens++; event.preventDefault(); });
document.getElementById('preview-tile-med_cert')?.click();
check(newPickerOpens === 1, 'selected photo tile opens file picker');
document.querySelector('#success-card-med_cert .document-view-button')?.click();
check(document.querySelector('#file-preview-modal .preview-modal-body img')?.getAttribute('src')?.startsWith('blob:'), 'selected View button opens image preview');
document.getElementById('result').textContent = failures.length ? `FAIL: ${failures.join(', ')}` : 'PASS: document tiles reselect and View buttons preview';
</script>
</body>
</html>
