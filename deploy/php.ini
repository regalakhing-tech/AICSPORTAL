; Match the XAMPP limits the app was built against, in Philippine time.
upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 512M
max_execution_time = 120
date.timezone = Asia/Manila
expose_php = Off

; Sign-in sessions live on the persistent volume (blocked from the web), so a
; deploy or restart does not sign everyone out; idle sessions end after 4 hours.
session.save_path = "/var/www/html/AICS/AICS/Applicants/uploads/.private/sessions"
session.gc_maxlifetime = 14400
